name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6
        env:
          # Set these under Settings → Secrets and variables → Actions → Variables.
          # Dev repo:  SITE_URL=https://dev.sevandalzell.com  DEPLOY_ENV=dev
          # Live repo: SITE_URL=https://sevandalzell.com      (no DEPLOY_ENV)
          SITE_URL: ${{ vars.SITE_URL }}
          DEPLOY_ENV: ${{ vars.DEPLOY_ENV }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
